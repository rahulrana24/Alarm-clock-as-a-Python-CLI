[project]
name = "alarm-clock"
version = "0.1.0"
description = "A small, extendable command-line alarm clock."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alarm = "alarm_clock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alarm_clock*"]
