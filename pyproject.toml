[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarmclock"
version = "0.1.0"
description = "A dependency-free alarm clock for the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
alarm = "alarmclock.cli:main"

[tool.setuptools.packages.find]
include = ["alarmclock*"]
